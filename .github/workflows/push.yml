name: GitHub 趋势每日推送

on:
  schedule:
    # 每天早上 8:00 运行 (UTC 0:00 = 北京时间 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run push script
        run: bash ./push.sh
